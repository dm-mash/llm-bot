# Диалог 2: подбор подарочного сертификата двоим.
#
# Корпус содержит два почти одинаковых документа — «Кольца для влюблённых»
# (2 участника, 3 часа) и «Ювелирная мастерская» (2,5 часа). Это ровно тот
# случай, из-за которого день23 завалился: анафора «а это то же самое, что
# ювелирная мастерская?» неразличима по смыслу, и нужен связный диалог.
#
# Плюс проверка отказа от домыслов: спросим про то, чего в базе нет.
#
# goal/clarified/terms — то, что диалог обязан удержать. check — вопрос, который
# стенд задаёт сам после последнего содержательного хода.

agent: researcher

goal: выбрать подарочный сертификат на двоих, без автомобиля и без полёта

clarified:
  - "общим курсом, не по отдельности"
  - "им обоим под 40 лет"

terms:
  "два участника": "сертификат рассчитан ровно на двоих, а не на одного гостя с двумя билетами"

check:
  question: "Назови цель нашего разговора и всё, что мы по ней зафиксировали."
  contains: ["двоих"]
  any_of: ["сертификат", "подарок"]
  also_expect: ["40", "автомобил", "полёт"]

turns:
  - user: "Хочу подарить сертификат двоим. Что вообще есть?"
    any_of: ["мастер-класс", "прыжок", "дайвинг", "полёт"]
    note: "первый широкий вопрос, дальше будем сужать"

  - user: "Автомобиль точно нет, они без машины. И летать тоже не готовы."
    any_of: ["автомобил", "машин", "пол[её]т", "не подойд", "мастер"]
    note: "два ограничения сразу, оба должны пережить диалог"

  - user: "Вдвоём, чтобы общий курс был, а не по отдельности. И обоим меньше 40."
    any_of: ["вдвоём", "двоих", "40", "участник"]
    note: "третье ограничение — возраст"

  - user: "Какие там вообще продолжительность и кто едет?"
    any_of: ["час", "минут", "участник"]

  - user: "И уточни, чтобы я не перепутал: «два участника» — это вдвоём за один заход, а не два отдельных билета."
    any_of: ["два участника", "двоих", "вдвоём", "заход"]
    note: "закрепляем термин явно — именно его спросим в закрывающем вопросе"

  - user: "А что нужно взять с собой?"
    any_of: ["паспорт", "одежд", "страховк", "спорт"]

  - user: "Есть вариант, где надо заранее договориться о дате?"
    any_of: ["7 дней", "недел", "заранее", "активац"]
    note: "проверка общего правила активации"

  - user: "А куда вообще звонить, если что?"
    any_of: ["\\+7", "телефон", "дарёныйконь", "telegram"]

  - user: "Есть вариант без спорта совсем?"
    any_of: ["мастер-класс", "ювелирн", "флоат", "фитобочк", "релаксац"]

  - user: "Вот это ювелирное — а чем оно отличается от «Кольца для влюблённых»?"
    any_of: ["ювелирн", "кольц", "мастер-класс", "браслет"]
    note: "ключевой ход: два похожих документа в одном корпусе"

  - user: "То есть в «Кольцах» вдвоём, а в мастерской по одному?"
    any_of: ["вдвоём", "двоих", "по одному", "один участник"]
    note: "различение, если оно в базе есть, должно сохраниться"

  - user: "А сиропы... ой, простите, а лимит по весу там есть?"
    any_of: ["вес", "лимит", "кг", "огранич"]
    note: "оговорка пользователя: проверяем, что бот не зациклится на лишнем"

  - user: "И последнее: дайвинг в июне есть вообще?"
    any_of: ["июн", "суббот", "дайвинг", "сезон"]
    note: "сезонность в базе есть — не выдумывать, а найти"

  - user: "А что-нибудь зимой работает?"
    any_of: ["зим", "не нашл", "нет", "не работает"]
    note: "в базе нет ни одной зимней программы: ожидаем честный отказ"
