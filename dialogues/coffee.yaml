# Диалог 1: подбор напитка и выпечки гостю с аллергией на орехи.
#
# Проверяется три разных вещи, и важно не смешивать их:
#   * факты из базы отвечаются верно (аллергены, часы, правило жалоб);
#   * ограничения, зафиксированные по ходу, доживают до конца диалога;
#   * на вопрос вне базы бот говорит, что её там нет, а не сочиняет.
#
# Ходы с анафорой («а сиропы у вас какие») обязательны: по одному ходу связность
# не проверяется, и именно на этом провалился день23.
#
# goal/clarified/terms — то, что диалог обязан удержать. check — вопрос, который
# стенд задаёт сам после последнего содержательного хода; это и есть проверка
# «не потерял цель». contains/any_of в check жёсткие, also_expect — только
# сигнал в отчёте: требовать от модели дословное «400 рублей» — значит ловить
# ошибку формулировки вместо ошибки памяти.

agent: researcher

goal: подобрать гостю с аллергией на орехи напиток и выпечку, которые ему подойдут

clarified:
  - "гость не пьёт молоко"
  - "бюджет — до 400 рублей на напиток и выпечку вместе"

terms:
  "строго без орехов": "и следы миндаля тоже не подходят"

check:
  question: "Назови цель нашего разговора и всё, что мы зафиксировали по гостю."
  contains: ["молок"]
  any_of: ["аллерг", "орех", "выпечк"]
  also_expect: ["400", "миндал"]

turns:
  - user: "Я бариста. Гость говорит, что у него аллергия на орехи. С чем у нас беда?"
    any_of: ["ореховый сироп", "миндал", "фундук"]
    note: "аллергены по базе, первое содержательное требование"

  - user: "Понял. Моя задача — подобрать ему напиток и что-то к нему из выпечки. Молоко он не пьёт."
    any_of: ["напиток", "выпечк", "эспрессо", "молок"]
    note: "здесь формулируется цель диалога"

  - user: "Бюджет — до 400 рублей на всё вместе."
    any_of: ["400", "бюджет", "₽"]
    note: "ограничение, которое обязано дожить до конца"

  - user: "А сиропы у вас какие вообще?"
    any_of: ["карамельный", "тростниковый", "ореховый"]

  - user: "Ореховый точно не надо. Карамельный подойдёт?"
    any_of: ["карамельный", "40"]

  - user: "Из выпечки что можно?"
    any_of: ["круассан", "веганск", "чизкейк", "бадмин"]

  - user: "Круассан же с миндалём — значит мимо."
    any_of: ["миндал", "аллерг", "не подойд", "нельзя"]

  - user: "И давай строго: следы миндаля тоже не подходят."
    any_of: ["миндал", "след", "орех", "аллерг"]
    note: "термин закреплён явно, а не подразумевается — его и спросим в конце"

  - user: "Ну и что в итоге предлагаешь гостю?"
    any_of: ["эспрессо", "флэт уайт", "раф на овсяном", "веганск"]

  - user: "А если он хочет взять с собой и не ждать?"
    any_of: ["самовывоз", "40 минут"]

  - user: "Какую доставку посоветуешь?"
    any_of: ["700", "150", "доставк"]

  - user: "И ещё: гость пожаловался на напиток. Что по правилам делать?"
    any_of: ["20%", "скидк", "замен", "менеджер"]

  - user: "В воскресенье банковский перевод у вас работает?"
    any_of: ["перевод", "воскресень", "не работает", "нельзя"]
    note: "точная формулировка из базы, а не пересказ"

  - user: "А есть ли у вас сезонное меню?"
    any_of: ["сезонн", "нашёл", "нет", "не нашл"]
    note: "вопроса нет в базе: ожидаем честный отказ, а не выдумку"
