# MCP servers available to the agent (template).
#
# Copy to data/mcp.yaml and edit. Each key is a server name; the agent selects
# servers with `--mcp <name>[,<name>...]` (or `--mcp all`).
#
#   stdio server : command (+ optional args / env) spawned as a child process
#   HTTP server  : url of a Streamable HTTP MCP endpoint
#
# Own servers live in llm_bot/mcp_servers/ and are launched as modules from
# the project root: python -m llm_bot.mcp_servers.<name>.
#
# Tool-loop budget: how many model replies ONE user turn may consume in the
# MCP loop (each round = one model reply; a batch of calls in one reply costs
# a single round). The default (4) fits a 3-call chain plus the final answer;
# raise it for long cross-server chains, e.g. the orchestration flow
# fetch -> analyze -> save_report -> add_note -> schedule_task (6 rounds).
# max_rounds: 8

# The config file location can be overridden with the MCP_CONFIG environment
# variable — useful when several processes (CLI, scheduler server, daemon)
# must share one config outside data/.

servers:
  # Own mock-CRM server (llm_bot/mcp_servers/notes.py) over a JSON file.
  notes:
    command: python
    args: [-m, llm_bot.mcp_servers.notes]
    env:
      NOTES_DB: data/notes.json

  # Own scheduler server (llm_bot/mcp_servers/scheduler.py): creates delayed /
  # periodic background tasks and reads aggregated results. Execution happens
  # in a separate long-lived process — start it once:
  #     python scripts/scheduler_daemon.py
  scheduler:
    command: python
    args: [-m, llm_bot.mcp_servers.scheduler]
    env:
      SCHEDULER_DB: data/scheduler.json

  # Own currency_yahoo server (llm_bot/mcp_servers/currency_yahoo.py): rate
  # tools over Yahoo Finance daily rates (no key) — fetch_rates ->
  # analyze_rates -> save_report (analysis report) and fetch_rates ->
  # save_series (raw dump to a JSON file). For offline use set
  # CURRENCY_FIXTURE to a pre-saved series file.
  currency_yahoo:
    command: python
    args: [-m, llm_bot.mcp_servers.currency_yahoo]
    env:
      CURRENCY_REPORTS_DB: data/currency_reports.json
      CURRENCY_SERIES_DIR: data/currency_series
      # CURRENCY_FIXTURE: data/cbr_fixture.json

  # Examples of adding more servers later — just new entries:
  #
  # time:                        # reference server from requirements.txt
  #   command: mcp-server-time
  #
  # deepwiki:                    # remote public MCP endpoint (no key needed)
  #   url: https://mcp.deepwiki.com/mcp
