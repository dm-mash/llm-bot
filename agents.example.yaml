# Copy this file to data/agents.yaml and fill in your values.
#
# This file defines AGENTS — the roles/behaviour. Each agent references a model
# from data/models.yaml (by the `model:` key) and carries its own generation
# settings and system prompt. Many agents can share one model profile while
# differing in behaviour.
#
# Agents do NOT store conversation history; sessions (created at runtime) do.
agents:
  assistant:
    model: openai-gpt4o          # must match a key in data/models.yaml
    default_system_prompt: "Отвечай на том же языке, на котором написан запрос."
    system_prompt: "Ты полезный помощник."
    temperature: 0.7
    max_tokens: 1024
    # --- Context compression (rolling summary) -------------------------------
    # Optional. Enables automatic history compression for sessions of this agent.
    #   keep_last_messages:        N — how many RECENT messages stay verbatim.
    #   summarize_messages_threshold: M — when the live history exceeds this many
    #                              messages, the oldest part is folded into a
    #                              running summary injected instead of the full
    #                              old dialog (updates every ~M-N turns).
    #   max_summary_tokens:        hard cap on the running summary size in tokens.
    #                              The summary is truncated to fit (never exceeds
    #                              the budget). Prevents a growing summary from
    #                              crowding out the context window.
    #   max_summary_ratio:         fallback/ceiling: summary <= this fraction of the
    #                              model's context window (default 0.3). Ignored
    #                              when max_summary_tokens is set and smaller.
    # Omit keep_last_messages / summarize_messages_threshold to keep sessions
    # uncompressed (the default).
    keep_last_messages: 10
    summarize_messages_threshold: 20
    max_summary_tokens: 500          # optional: cap summary size
    # max_summary_ratio: 0.25        # optional: cap as a share of the context window

  # --- Pluggable context strategies (without summary) -------------------------
  # Instead of rolling-summary, you can pick ONE context-management strategy:
  #   context_strategy: sliding   # only the last N messages are sent
  #   context_strategy: facts     # durable key/value memory + last N messages
  #   context_strategy: branching # fork the dialog into independent lines
  # Optional shared knob:
  #   context_window_messages: N  # sliding-window size in MESSAGES (for sliding/
  #                               # facts; optional cap for branching). Default:
  #                               # the full history is used when unset.
  #   context_max_facts: K        # cap for the "facts" memory (default 20)
  #
  # Example:
  #   assistant-sliding:
  #     model: openai-gpt4o
  #     system_prompt: "Ты полезный помощник."
  #     context_strategy: sliding
  #     context_window_messages: 8
  #
  # Note: a strategy takes precedence over keep_last_messages/summarize_messages_threshold.

  translator:
    model: openai-gpt4o
    system_prompt: "Переводи с русского на английский и обратно. Отвечай только переводом."
    temperature: 0.2
    max_tokens: 512

  critic:
    model: openai-gpt4o
    system_prompt: "Давай строгий критический разбор текста, указывай слабые места."
    temperature: 0.9

  local-chat:
    model: ollama-local
    system_prompt: "Ты дружелюбный ассистент."